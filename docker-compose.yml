services:
  web:
    build: .
    container_name: bg-scratch-web
    restart: unless-stopped
    environment:
      SCRATCH_FLAG: "${SCRATCH_FLAG:-}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    volumes:
      - data:/data
    networks:
      - default
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      # HTTP Router
      - "traefik.http.routers.bgscratch.rule=Host(`bg-scratch.debora`)"
      - "traefik.http.routers.bgscratch.entrypoints=web"
      - "traefik.http.routers.bgscratch.middlewares=bgs-redirect"
      # HTTPS Router
      - "traefik.http.routers.bgscratch-secure.rule=Host(`bg-scratch.debora`)"
      - "traefik.http.routers.bgscratch-secure.entrypoints=websecure"
      - "traefik.http.routers.bgscratch-secure.tls=true"
      - "traefik.http.routers.bgscratch-secure.middlewares=bgs-security,bgs-compress,bgs-ratelimit"
      # Service
      - "traefik.http.services.bgscratch.loadbalancer.server.port=8080"
      # Middleware for HTTPS redirect
      - "traefik.http.middlewares.bgs-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.bgs-redirect.redirectscheme.permanent=true"
      # MIDDLEWARE: Security Headers
      - "traefik.http.middlewares.bgs-security.headers.stsSeconds=63072000"
      - "traefik.http.middlewares.bgs-security.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.bgs-security.headers.stsPreload=true"
      - "traefik.http.middlewares.bgs-security.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.bgs-security.headers.frameDeny=true"
      - "traefik.http.middlewares.bgs-security.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.bgs-security.headers.browserXssFilter=true"
      - "traefik.http.middlewares.bgs-security.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.bgs-security.headers.permissionsPolicy=camera=(), microphone=(), geolocation=(), interest-cohort=()"
      # MIDDLEWARE: Compression
      - "traefik.http.middlewares.bgs-compress.compress=true"
      - "traefik.http.middlewares.bgs-compress.compress.minResponseBodyBytes=1024"
      # MIDDLEWARE: Rate Limiting
      - "traefik.http.middlewares.bgs-ratelimit.ratelimit.average=50"
      - "traefik.http.middlewares.bgs-ratelimit.ratelimit.burst=100"
      - "traefik.http.middlewares.bgs-ratelimit.ratelimit.period=1s"

  worker:
    build: .
    command: ["python", "/app/worker.py"]
    container_name: bg-scratch-worker
    restart: unless-stopped
    volumes:
      - data:/data

volumes:
  data: {}

networks:
  traefik:
    external: true
