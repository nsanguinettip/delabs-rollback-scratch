services:
  web:
    build:
      context: .
      args:
        PB_FLAVOR: "${PB_FLAVOR:-plain}"
    container_name: pb-scratch-web
    restart: unless-stopped
    environment:
      SCRATCH_FLAG: ${SCRATCH_FLAG:-none}
      DOTENV_VALUE: ${DOTENV_VALUE:-missing}
      PB_REQUIRED: ${PB_REQUIRED:?PB_REQUIRED must be set in the stack Env}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - default
      - traefik
    labels:
      - traefik.enable=true
      - traefik.http.routers.pbscratch.rule=Host(`pb-scratch.debora`)
      - traefik.http.routers.pbscratch.entrypoints=websecure
      - traefik.http.routers.pbscratch.tls=true
      - traefik.http.services.pbscratch.loadbalancer.server.port=8080
  named:
    build: .
    image: pb-scratch/named:local
    command: ["python", "-c", "import time; time.sleep(10**9)"]
    stop_grace_period: 1s
  side:
    image: busybox:1.36.1
    command: ["sleep", "infinity"]
    stop_grace_period: 1s
  pinned:
    image: alpine:3.21.0@sha256:21dc6063fd678b478f57c0e13f47560d0ea4eeba26dfc947b2a4f81f686b9f45
    command: ["sleep", "infinity"]
    stop_grace_period: 1s

networks:
  traefik:
    external: true
